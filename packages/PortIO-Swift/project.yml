name: PortIO
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  xcodeVersion: "15.0"
  groupSortPosition: top
  useBaseInternationalization: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  PortIO:
    type: application
    platform: macOS
    sources:
      - path: PortIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.port-monitor
        PRODUCT_NAME: Port Monitor
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: PortIO/PortIO.entitlements
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: PortIO/Info.plist
    entitlements:
      path: PortIO/PortIO.entitlements
